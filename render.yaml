# Render Blueprint for HEBR & ABAAD.
# Secrets are referenced, not stored. Fill sync:false values in the Render dashboard.
# MySQL is not created here: Render MySQL is paid. Attach any MySQL 8 host via DB_* vars.

services:
  - type: web
    name: hebr-abaad-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: Hebr & Ab3ad
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_LEVEL
        value: error
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: ar
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: SANCTUM_STATEFUL_DOMAINS
        value: ""
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_MAILER
        value: log
      - key: RUN_DB_SEED
        value: "true"
      - key: DEMO_PASSWORD
        sync: false
      - key: CONSULTANT_ENABLED
        value: "true"
      - key: CONSULTANT_AI_PROVIDER
        value: rules
      - key: PAYTABS_PROFILE_ID
        sync: false
      - key: PAYTABS_SERVER_KEY
        sync: false
      - key: PAYTABS_BASE_URL
        value: https://secure-egypt.paytabs.com
      - key: PAYTABS_ENVIRONMENT
        value: test

  - type: web
    name: hebr-abaad-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
